services:
  backend:
    build:
      context: ./backend
    environment:
      FRAMENOTES_JOBS_DIR: /app/data/jobs
      FRAMENOTES_AUTHORIZED_ROOTS: /workspace/media
      FRAMENOTES_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./media:/workspace/media:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
