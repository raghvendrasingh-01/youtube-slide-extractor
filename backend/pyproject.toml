[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framenotes-ai-backend"
version = "0.1.0"
description = "Local frame extraction and slide-note backend for FrameNotes AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "ImageHash>=4.3",
    "scikit-image>=0.23",
    "reportlab>=4.1",
    "python-pptx>=0.6.23",
    "yt-dlp>=2024.10",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-ra"
